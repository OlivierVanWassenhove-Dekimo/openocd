namespace import testing_helpers::*

# No adapter or hardware is needed to test reset_config parsing.
check_matches {^none separate$} {reset_config}
check_matches {^aarch64_psci_reset separate$} {reset_config aarch64_psci_reset}
check_matches {^aarch64_psci_reset separate$} {reset_config}

# Partial updates retain the PSCI reset selection.
check_matches {^aarch64_psci_reset srst_pulls_trst$} {reset_config srst_pulls_trst}
check_matches {^aarch64_psci_reset separate$} {reset_config separate}

# PSCI reset belongs to the mutually exclusive signals group.
check_syntax_err {reset_config aarch64_psci_reset srst_only}
check_syntax_err {reset_config none aarch64_psci_reset}
check_syntax_err {reset_config aarch64_psci_reset aarch64_psci_reset}
check_matches {^aarch64_psci_reset separate$} {reset_config}
check_syntax_err {reset_config none invalid_flag}
check_syntax_err {reset_config arch_reset}
check_matches {^aarch64_psci_reset separate$} {reset_config}

# Replacing the signals selection clears PSCI reset and vice versa.
check_matches {^srst_only separate srst_gates_jtag srst_open_drain connect_deassert_srst$} {
    reset_config srst_only
}
check_matches {^aarch64_psci_reset separate$} {reset_config aarch64_psci_reset}
check_matches {^trst_only separate trst_push_pull$} {reset_config trst_only}
check_matches {^aarch64_psci_reset separate$} {reset_config aarch64_psci_reset}
check_matches {^trst_and_srst separate srst_gates_jtag trst_push_pull srst_open_drain connect_deassert_srst$} {
    reset_config trst_and_srst
}
check_matches {^aarch64_psci_reset separate$} {reset_config aarch64_psci_reset}
check_matches {^none separate$} {reset_config none}

shutdown
