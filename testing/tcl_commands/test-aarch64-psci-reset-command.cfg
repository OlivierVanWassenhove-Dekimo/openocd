namespace import testing_helpers::*

adapter driver dummy
jtag newtap tap cpu -irlen 4
dap create test.dap -tap tap.cpu
cti create test.cti -dap test.dap -ap-num 0 -baseaddr 0x10000
target create test.a55 aarch64 -dap test.dap -dbgbase 0x20000 -cti test.cti -defer-examine
target create test.other aarch64 -dap test.dap -dbgbase 0x30000 -cti test.cti -defer-examine
target create test.generic testee -tap tap.cpu

# Selection and scratch configuration need no examination or hardware access.
targets test.a55
check_matches {^aarch64_psci_reset separate$} {reset_config aarch64_psci_reset}
check_matches {^aarch64_psci_reset separate$} {reset_config}
check_syntax_err {reset_config arch_reset}
check_matches {^not configured$} {aarch64 reset_trampoline}
check_matches {^0x0*80100000$} {aarch64 reset_trampoline 0x80100000}
check_matches {^0x0*80100000$} {aarch64 reset_trampoline}
check_syntax_err {aarch64 reset_trampoline 0x80100000 extra}
check_for_error -603 {} {aarch64 reset_trampoline 0x80100004}
check_for_error -603 {} {aarch64 reset_trampoline 0xffffffffffffffc0}
check_matches {^0x0*80100000$} {aarch64 reset_trampoline}

# The scratch address belongs to the selected target; zero is explicit.
targets test.other
check_matches {^not configured$} {aarch64 reset_trampoline}
check_matches {^0x0+$} {aarch64 reset_trampoline 0}
targets test.a55
check_matches {^0x0*80100000$} {aarch64 reset_trampoline}

# Reject non-AArch64 targets without casting their architecture state.
targets test.generic
check_for_error -603 {} {aarch64 reset_trampoline 0x80100000}

shutdown
